owner: distrochooser # GitHub username
repo: status # GitHub repository name
sites: # List of endpoints to track
  - name: Distrochooser 5 Frontend
    url: https://old.distrochooser.de
    icon: https://old.distrochooser.de/icon.svg
    maxResponseTime: 1500
  - name: Distrochooser 5 Backend
    url: https://waldorf5.distrochooser.de/
    icon: https://old.distrochooser.de/icon.svg
    expectedStatusCodes:
      - 404  
    maxResponseTime: 1500
  - name: Distrochooser 6 Frontend
    url: https://distrochooser.de
    icon: https://assets6.distrochooser.de/icon.svg
  - name: Distrochooser 6 Backend
    url: https://waldorf6.distrochooser.de/ping
    icon: https://assets6.distrochooser.de/icon.svg
    maxResponseTime: 1500
  - name: Distrochooser 6 Assets
    url: https://assets6.distrochooser.de/icon.svg
    icon: https://assets6.distrochooser.de/icon.svg
    maxResponseTime: 1500
assignees: # Users to assign downtime issues (optional)
  - cmllr
status-website:
  baseUrl: /status
  name: Distrochooser status  
  introTitle: "System status of the distrochooser.de project"
  introMessage: "System overview for distrochooser.de, updated each hour"
  faviconSvg: https://assets6.distrochooser.de/icon.svg
  logoUrl: https://assets6.distrochooser.de/icon.svg
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "0 * * * *"
